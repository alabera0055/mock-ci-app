 name: Test Management tests

  on:
    workflow_dispatch:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install
          run: npm ci

        - name: Type check
          run: npx tsc --noEmit

        - name: Run tests
          run: >-
            node --test
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=results.xml
            tests/login.test.ts

        - name: Save results for Test Management
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: results.xml
            if-no-files-found: error
