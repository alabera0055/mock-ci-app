name: TM tests
  on:
    workflow_dispatch:
      inputs:
        sha:
          description: Commit to test; empty tests the branch
          required: false
          default: ''
  jobs:
    tests:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            ref: ${{ inputs.sha || github.ref }}
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm ci
        - run: npx playwright install --with-deps chromium
        - run: npx playwright test
        - uses: actions/upload-artifact@v4
          if: always()
          with:
            name: test-results
            path: results.xml